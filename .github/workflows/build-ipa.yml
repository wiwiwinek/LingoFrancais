name: Build TrollStore IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Embedded App Source
        run: |
          echo "" | base64 -d > app_source.tar.gz
          tar -xzf app_source.tar.gz
          rm app_source.tar.gz
          ls -la

      - name: Install Tools (XcodeGen & ldid)
        run: |
          brew install xcodegen ldid

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Compile iOS App
        run: |
          xcodebuild -project LingoFrancais.xcodeproj             -scheme LingoFrancais             -configuration Release             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build

      - name: Package IPA for TrollStore
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/LingoFrancais.app Payload/
          ldid -S Payload/LingoFrancais.app/LingoFrancais || true
          zip -r LingoFrancais.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoFrancais-TrollStore-IPA
          path: LingoFrancais.ipa
          retention-days: 14
